<!DOCTYPE html>
<html>
<head>
    <title>Password Hash Test</title>
</head>
<body>
    <h1>Password Hash Test</h1>
    <p>Testing SHA-256 hash for: <code>sde-moderate-2026</code></p>

    <div id="result"></div>

    <script>
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function test() {
            const password = 'sde-moderate-2026';
            const hash = await hashPassword(password);
            const expectedHash = '6f2caa2e0740a6b4563a0ca4463b14fbb832887f6ac9d075809e5a168ba27b21';

            const result = document.getElementById('result');
            result.innerHTML = `
                <h2>Results:</h2>
                <p><strong>Password:</strong> ${password}</p>
                <p><strong>Generated Hash:</strong><br><code>${hash}</code></p>
                <p><strong>Expected Hash:</strong><br><code>${expectedHash}</code></p>
                <p><strong>Match:</strong> ${hash === expectedHash ? '✅ YES' : '❌ NO'}</p>
            `;

            console.log('Generated:', hash);
            console.log('Expected:', expectedHash);
            console.log('Match:', hash === expectedHash);
        }

        test();
    </script>
</body>
</html>
