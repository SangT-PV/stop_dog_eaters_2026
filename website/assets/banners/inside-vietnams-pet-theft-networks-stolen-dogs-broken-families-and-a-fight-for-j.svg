    <tspan x="60" dy="0">Inside Vietnam&apos;s Pet Theft Networks:</tspan><tspan x="60" dy="50">Stolen Dogs, Broken Families, and a</tspan><tspan x="60" dy="50">Fight for Justice</tspan>
  </text>

  <!-- Subtitle -->
  <text x="60" y="370" font-family="Crimson Text" font-size="16" fill="rgba(255,255,255,0.8)">
    <tspan x="60" dy="0">Police dismantle organized theft rings targeting f</tspan>
    <tspan x="60" dy="24">amily pets across Vietnam. New evidence reveals th</tspan>
  </text>

